name: Android CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          PREINSTALLED=""
          for candidate in /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$HOME"/Android/Sdk/cmdline-tools/latest/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              PREINSTALLED="$candidate"
              break
            fi
          done
          if [ -z "$PREINSTALLED" ]; then
            PREINSTALLED=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          fi
          if [ -z "$PREINSTALLED" ]; then
            echo "Downloading command line tools"
            curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf "$RUNNER_TEMP/cmdline-tools"
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            mv "$RUNNER_TEMP/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            PREINSTALLED="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using $PREINSTALLED"
          yes | "$PREINSTALLED" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$PREINSTALLED" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Test, lint, and assemble
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          aapt dump badging app/build/outputs/apk/debug/app-debug.apk | head -5
      - name: Package downloadable artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/INFINITE.apk
          sha256sum dist/INFINITE.apk | cut -d' ' -f1 > dist/INFINITE.apk.sha256
          zip -j dist/INFINITE-apk.zip dist/INFINITE.apk dist/INFINITE.apk.sha256
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: INFINITE-android-apk
          path: dist/INFINITE-apk.zip
          if-no-files-found: error
          retention-days: 30
      - name: Write job summary
        run: |
          {
            printf '### INFINITE Android build\n\n'
            printf 'APK package: `INFINITE-apk.zip`\n\n'
            printf 'SHA-256: `%s`\n' "$(cat dist/INFINITE.apk.sha256)"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish APK release
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: INFINITE-android-apk
          path: dist
      - name: Extract APK package
        run: |
          set -euo pipefail
          unzip -o dist/INFINITE-apk.zip -d dist
          test -s dist/INFINITE.apk
          test -s dist/INFINITE.apk.sha256
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Endless Android combat roguelite. Download INFINITE.apk and allow installation from unknown sources."
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 dist/INFINITE.apk dist/INFINITE.apk.sha256 dist/INFINITE-apk.zip --clobber
          else
            gh release create v1.0.0 dist/INFINITE.apk dist/INFINITE.apk.sha256 dist/INFINITE-apk.zip --title "INFINITE v1.0.0" --notes "$NOTES"
          fi
